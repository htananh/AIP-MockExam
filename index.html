<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AWS AIP-C01 — Chọn đề luyện tập</title>
<style>
  :root{
    --bg:#f7f9fa; --card:#fff; --text:#1c1d1f; --muted:#6a6f73;
    --accent:#a435f0; --accent-dark:#6d28d2; --accent-soft:#f6f0fd;
    --border:#d1d7dc; --green:#1e7e34; --green-soft:#eaf7ee;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
  header{background:#1c1d1f;color:#fff;padding:20px 24px}
  header h1{margin:0;font-size:20px;font-weight:700}
  header p{margin:6px 0 0;font-size:14px;opacity:.8}
  .wrap{max-width:960px;margin:32px auto;padding:0 20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
  .exam{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:12px;transition:box-shadow .15s,transform .15s}
  .exam:hover{box-shadow:0 6px 20px rgba(0,0,0,.1);transform:translateY(-2px)}
  .exam h2{margin:0;font-size:18px;font-weight:700}
  .exam .meta{font-size:14px;color:var(--muted)}
  .badges{display:flex;flex-wrap:wrap;gap:8px}
  .badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px}
  .badge.score{background:var(--green-soft);color:var(--green)}
  .badge.progress{background:var(--accent-soft);color:var(--accent-dark)}
  .start{margin-top:auto;display:inline-block;text-align:center;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;font-size:15px;padding:11px 16px;border-radius:8px;transition:background .15s}
  .start:hover{background:var(--accent-dark)}
  .card-actions{margin-top:auto;display:flex;flex-direction:column;gap:10px}
  .card-actions .start{margin-top:0}
  .sub-actions{display:flex;gap:10px}
  .sub-actions a{flex:1;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font-weight:700;font-size:14px;padding:9px 12px;border-radius:8px;border:1px solid var(--border);color:var(--accent-dark);background:#fff;transition:background .15s}
  .sub-actions a:hover{background:var(--accent-soft)}
  .empty{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:40px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>AWS Generative AI Developer Professional — AIP-C01</h1>
  <p>Chọn một đề bên dưới để bắt đầu luyện tập. Thời gian mỗi đề: 3 tiếng.</p>
</header>

<div class="wrap">
  <div id="grid" class="grid"></div>
</div>

<script src="config.js"></script>
<script src="exams.js"></script>
<script>
(function () {
  const EXAMS = window.EXAMS || [];
  const grid = document.getElementById("grid");

  if (!EXAMS.length) {
    grid.outerHTML = '<div class="empty">Chưa có đề nào. Chạy <code>python extract_questions.py</code> để tạo dữ liệu.</div>';
    return;
  }

  const bestScore = (id) => {
    try {
      const h = JSON.parse(localStorage.getItem("aip_history_" + id)) || [];
      if (!h.length) return null;
      return Math.max.apply(null, h.map((r) => r.percent || 0));
    } catch (e) { return null; }
  };

  const inProgress = (id) => {
    try {
      const s = JSON.parse(localStorage.getItem("aip_state_" + id));
      if (!s || s.submitted) return 0;
      return Object.keys(s.answers || {}).length;
    } catch (e) { return 0; }
  };

  EXAMS.forEach((e) => {
    const card = document.createElement("div");
    card.className = "exam";

    const best = bestScore(e.id);
    const doing = inProgress(e.id);
    let badges = "";
    if (best != null) badges += `<span class="badge score">🏆 Cao nhất: ${best}%</span>`;
    if (doing) badges += `<span class="badge progress">⏳ Đang làm dở: ${doing} câu</span>`;

    card.innerHTML =
      `<h2>${e.name}</h2>` +
      `<div class="meta">${e.questions.length} câu hỏi · 3 giờ</div>` +
      (badges ? `<div class="badges">${badges}</div>` : "") +
      `<div class="card-actions">` +
        `<a class="start" href="exam.html?exam=${encodeURIComponent(e.id)}">${doing ? "Tiếp tục làm bài" : "Thi thử (tính giờ 3h)"}</a>` +
        `<div class="sub-actions">` +
          `<a href="exam.html?exam=${encodeURIComponent(e.id)}&mode=practice" title="Luyện tập, không tính giờ">🧪 Thực hành</a>` +
          `<a href="exam.html?exam=${encodeURIComponent(e.id)}&history=1" title="Xem lịch sử làm bài">📊 Lịch sử</a>` +
        `</div>` +
      `</div>`;

    grid.appendChild(card);
  });
})();
</script>
</body>
</html>
