<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWS AIP-C01 Practice Exam</title>
<style>
  :root {
    --bg: #f7f9fa;
    --card: #ffffff;
    --muted: #6a6f73;
    --text: #1c1d1f;
    --accent: #a435f0;
    --accent-dark: #6d28d2;
    --accent-soft: #f6f0fd;
    --green: #1e7e34;
    --green-bg: #eaf7ee;
    --red: #b02a1e;
    --red-bg: #fdeceb;
    --border: #d1d7dc;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    font-size: 17px;
    padding-bottom: 90px;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: #1c1d1f;
    color: #fff;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 17px; font-weight: 700; margin: 0; flex: 1; min-width: 160px; color: #fff; }
  header select {
    font-size: 15px;
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid #3e4143;
    background: #2d2f31;
    color: #fff;
  }
  .timer-wrap { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.1; }
  .timer-wrap .lbl { font-size: 12px; color: #b9bbbe; text-transform: uppercase; letter-spacing: .5px; }
  .timer {
    font-variant-numeric: tabular-nums;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #fff;
  }
  .timer.warn { color: #f5c518; }
  .timer.danger { color: #ff6a5e; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .4; } }
  button {
    cursor: pointer;
    font-family: inherit;
    border: 1px solid var(--text);
    background: #fff;
    color: var(--text);
    padding: 10px 18px;
    border-radius: 4px;
    font-size: 15px;
    font-weight: 700;
    transition: background .15s, color .15s;
  }
  button:hover { background: #f2f3f5; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  button.success { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.success:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  header button { background: transparent; color: #fff; border-color: #6a6f73; }
  header button:hover { background: #2d2f31; }
  .wrap { max-width: 940px; margin: 24px auto; padding: 0 16px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 32px;
    box-shadow: 0 2px 4px rgba(0,0,0,.06);
  }
  .qmeta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--text);
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 18px;
    gap: 10px;
    flex-wrap: wrap;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  .badge {
    font-size: 13px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 4px;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .badge.multi { color: var(--accent-dark); border-color: var(--accent); background: var(--accent-soft); }
  .badge.answered { color: var(--green); border-color: var(--green); background: var(--green-bg); }
  .qtext { font-size: 19px; font-weight: 600; white-space: pre-wrap; margin-bottom: 24px; color: var(--text); }
  .options { display: flex; flex-direction: column; gap: 12px; }
  .option {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 8px;
    padding: 15px 18px;
    cursor: pointer;
    font-size: 16px;
    transition: border-color .15s, background .15s, box-shadow .15s;
  }
  .option:hover { border-color: var(--accent); background: var(--accent-soft); }
  .option .letter {
    flex-shrink: 0;
    font-weight: 700;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #f2f3f5;
    border: 1px solid var(--border);
    display: grid;
    place-items: center;
    font-size: 14px;
    color: var(--text);
  }
  .option.selected { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
  .option.selected .letter { background: var(--accent); border-color: var(--accent); color: #fff; }
  .option.correct { border-color: var(--green); background: var(--green-bg); box-shadow: inset 0 0 0 1px var(--green); }
  .option.correct .letter { background: var(--green); border-color: var(--green); color: #fff; }
  .option.wrong { border-color: var(--red); background: var(--red-bg); box-shadow: inset 0 0 0 1px var(--red); }
  .option.wrong .letter { background: var(--red); border-color: var(--red); color: #fff; }
  .actions { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
  .answer-box {
    margin-top: 22px;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    display: none;
  }
  .answer-box.show { display: block; }
  .answer-head {
    background: var(--accent-soft);
    padding: 14px 18px;
    font-weight: 700;
    font-size: 16px;
    color: var(--text);
    border-bottom: 1px solid var(--border);
  }
  .answer-head .ok { color: var(--green); }
  .explanation {
    padding: 18px;
    white-space: pre-wrap;
    font-size: 15px;
    color: #3e4143;
    max-height: 460px;
    overflow: auto;
  }
  .nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 24px;
    gap: 12px;
  }
  .nav .jump { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 15px; }
  .nav input { width: 66px; padding: 8px; border-radius: 4px; border: 1px solid var(--border); background: #fff; color: var(--text); text-align: center; font-size: 15px; }
  .progress { height: 8px; background: #e4e8eb; border-radius: 999px; overflow: hidden; margin-top: 18px; display: flex; }
  .progress > div { height: 100%; transition: width .2s; }
  .progress .done { background: var(--accent); }
  .toolbar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 9;
    display: flex; gap: 10px; align-items: center;
    background: #fff; border-top: 1px solid var(--border);
    padding: 12px 24px; box-shadow: 0 -2px 8px rgba(0,0,0,.06);
  }
  .toolbar .spacer { flex: 1; }
  .hint { color: var(--muted); font-size: 13px; }
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    display: none; place-items: center; z-index: 50; padding: 16px;
  }
  .overlay.show { display: grid; }
  .modal {
    background: var(--card); border: 1px solid var(--border);
    padding: 28px; border-radius: 8px; max-width: 560px; width: 100%;
    max-height: 85vh; overflow: auto; box-shadow: 0 10px 30px rgba(0,0,0,.2);
  }
  .modal h2 { margin-top: 0; }
  .score-big { font-size: 52px; font-weight: 800; }
  .score-big.pass { color: var(--green); }
  .score-big.fail { color: var(--red); }
  table { width: 100%; border-collapse: collapse; font-size: 15px; margin-top: 12px; }
  th, td { text-align: left; padding: 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 700; }
  .modal .close-row { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
</style>
</head>
<body>
<header>
  <a href="index.html" style="color:#fff;text-decoration:none;font-size:14px;font-weight:600;opacity:.85;">← Trang chủ</a>
  <h1>AWS Generative AI Developer Professional — AIP-C01</h1>
  <select id="examSelect" title="Chọn đề"></select>
  <div class="timer-wrap">
    <span class="lbl">Time left</span>
    <span class="timer" id="timer">03:00:00</span>
  </div>
  <button id="pauseBtn">⏸ Pause</button>
  <button id="resetTimerBtn">↻ Timer</button>
</header>

<div class="wrap">
  <div class="card">
    <div id="reviewBanner" style="display:none; align-items:center; gap:12px; flex-wrap:wrap; background:var(--accent-soft); border:1px solid var(--accent); border-radius:8px; padding:12px 16px; margin-bottom:18px;">
      <span id="reviewInfo" style="flex:1; min-width:180px; font-size:14px; color:var(--accent-dark); font-weight:600;"></span>
      <button id="exitReviewBtn">✕ Thoát review</button>
    </div>
    <div class="qmeta">
      <span id="counter"></span>
      <span>
        <span class="badge" id="answeredBadge" style="display:none">Answered</span>
        <span class="badge" id="typeBadge"></span>
      </span>
    </div>
    <div class="qtext" id="qtext"></div>
    <div class="options" id="options"></div>

    <div class="actions">
      <button class="primary" id="showBtn">Show answer</button>
      <button id="clearBtn">Clear selection</button>
    </div>

    <div class="answer-box" id="answerBox">
      <div class="answer-head" id="answerHead"></div>
      <div class="explanation" id="explanation"></div>
    </div>

    <div class="nav">
      <button id="prevBtn">← Prev</button>
      <div class="jump">
        Question
        <input type="number" id="jumpInput" min="1">
        / <span id="total"></span>
      </div>
      <button id="nextBtn">Next →</button>
    </div>
    <div class="progress" id="progress"></div>

    <div class="toolbar">
      <button class="success" id="submitBtn">✔ Nộp bài &amp; lưu kết quả</button>
      <button id="historyBtn">📊 Lịch sử</button>
      <button id="resetProgressBtn">🗑 Xóa bài làm</button>
      <span class="spacer"></span>
      <span class="hint" id="savedHint">Đã tự lưu</span>
    </div>
  </div>
</div>

<!-- Pause overlay -->
<div class="overlay" id="pauseOverlay">
  <div class="modal" style="text-align:center">
    <h2 id="pauseTitle">⏸ Paused</h2>
    <p style="color:var(--muted)" id="pauseMsg">Bấm Resume để tiếp tục.</p>
    <button class="primary" id="resumeBtn">▶ Resume</button>
  </div>
</div>

<!-- Result overlay -->
<div class="overlay" id="resultOverlay">
  <div class="modal">
    <h2>Kết quả</h2>
    <div id="resultBody"></div>
    <div class="close-row">
      <button id="reviewBtn">Xem lại từng câu</button>
      <button class="primary" id="closeResultBtn">Đóng</button>
    </div>
  </div>
</div>

<!-- History overlay -->
<div class="overlay" id="historyOverlay">
  <div class="modal">
    <h2 id="historyTitle">Lịch sử làm bài</h2>
    <div id="historyBody"></div>
    <div class="close-row">
      <button id="clearHistoryBtn">Xóa lịch sử</button>
      <button class="primary" id="closeHistoryBtn">Đóng</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="exams.js"></script>
<script>
(function () {
  const EXAMS = window.EXAMS || [];
  const TOTAL = 3 * 60 * 60; // seconds
  const el = (id) => document.getElementById(id);
  const escape = (s) => (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  if (!EXAMS.length) {
    document.querySelector(".card").innerHTML = "<p>Không tìm thấy đề. Hãy chạy <code>python extract_questions.py</code>.</p>";
    return;
  }

  /* ---------- Supabase (lưu kết quả) ---------- */
  const SB_URL = (window.SUPABASE_URL || "").replace(/\/$/, "");
  const SB_KEY = window.SUPABASE_ANON_KEY || "";
  const sbEnabled = !!(SB_URL && SB_KEY);
  let deviceId = localStorage.getItem("aip_device");
  if (!deviceId) {
    deviceId = "dev_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
    localStorage.setItem("aip_device", deviceId);
  }
  // USER_ID cố định (nếu đặt trong config.js) sẽ ưu tiên để lịch sử ổn định mọi nơi
  if (window.USER_ID) deviceId = window.USER_ID;
  function sbHeaders(extra) {
    return Object.assign(
      { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY, "Content-Type": "application/json" },
      extra || {}
    );
  }
  async function sbInsert(row) {
    const res = await fetch(SB_URL + "/rest/v1/exam_results", {
      method: "POST", headers: sbHeaders({ Prefer: "return=minimal" }), body: JSON.stringify(row),
    });
    if (!res.ok) throw new Error(await res.text());
  }
  async function sbList(examId) {
    const url = SB_URL + "/rest/v1/exam_results?device_id=eq." + encodeURIComponent(deviceId) +
      "&exam_id=eq." + encodeURIComponent(examId) + "&order=created_at.desc";
    const res = await fetch(url, { headers: sbHeaders() });
    if (!res.ok) throw new Error(await res.text());
    return (await res.json()).map((r) => ({
      date: r.created_at, percent: r.percent, correct: r.correct, total: r.total,
      answered: r.answered, timeUsed: r.time_used, answers: r.answers,
    }));
  }
  async function sbClear(examId) {
    const url = SB_URL + "/rest/v1/exam_results?device_id=eq." + encodeURIComponent(deviceId) +
      "&exam_id=eq." + encodeURIComponent(examId);
    const res = await fetch(url, { method: "DELETE", headers: sbHeaders({ Prefer: "return=minimal" }) });
    if (!res.ok) throw new Error(await res.text());
  }

  let exam, idx, remaining, running = true, tick = null, state;
  let reviewMode = false, reviewData = null;
  let historyCache = [];

  /* ---------- Persistence ---------- */
  const stateKey = (id) => "aip_state_" + id;
  const historyKey = (id) => "aip_history_" + id;

  function loadState(id) {
    try { return JSON.parse(localStorage.getItem(stateKey(id))) || null; }
    catch (e) { return null; }
  }
  function saveState() {
    if (reviewMode) return;
    state.idx = idx;
    state.remaining = remaining;
    state.updatedAt = Date.now();
    localStorage.setItem(stateKey(exam.id), JSON.stringify(state));
    flashSaved();
  }
  let savedTimer = null;
  function flashSaved() {
    el("savedHint").textContent = "Đã tự lưu ✓";
    clearTimeout(savedTimer);
    savedTimer = setTimeout(() => (el("savedHint").textContent = "Đã tự lưu"), 1200);
  }
  function getHistory(id) {
    try { return JSON.parse(localStorage.getItem(historyKey(id))) || []; }
    catch (e) { return []; }
  }
  function pushHistory(id, rec) {
    const h = getHistory(id);
    h.unshift(rec);
    localStorage.setItem(historyKey(id), JSON.stringify(h));
  }

  function selSet(i) {
    const src = reviewMode ? (reviewData.answers || {}) : state.answers;
    return new Set(src[i] || []);
  }
  function setSel(i, set) { state.answers[i] = [...set]; }

  /* ---------- Exam loading ---------- */
  function buildExamSelect() {
    const s = el("examSelect");
    s.innerHTML = "";
    EXAMS.forEach((e) => {
      const o = document.createElement("option");
      o.value = e.id;
      o.textContent = `${e.name} (${e.questions.length} câu)`;
      s.appendChild(o);
    });
  }

  function loadExam(id) {
    if (tick) clearInterval(tick);
    reviewMode = false; reviewData = null;
    el("reviewBanner").style.display = "none";
    exam = EXAMS.find((e) => e.id === id) || EXAMS[0];
    el("examSelect").value = exam.id;
    state = loadState(exam.id) || { answers: {}, idx: 0, remaining: TOTAL, submitted: false };
    if (typeof state.remaining !== "number") state.remaining = TOTAL;
    idx = Math.min(state.idx || 0, exam.questions.length - 1);
    remaining = state.remaining;
    render();
    updateTimer();
    start();
  }

  function currentQuestion() { return exam.questions[idx]; }

  function render() {
    const q = currentQuestion();
    if (!q) return;
    const multi = (q.correct_answers || []).length > 1;
    const sel = selSet(idx);

    el("counter").textContent = `Question ${q.number} of ${exam.questions.length}`;
    el("typeBadge").textContent = multi ? "Choose " + q.correct_answers.length : "Single answer";
    el("typeBadge").className = "badge" + (multi ? " multi" : "");
    el("answeredBadge").style.display = sel.size ? "" : "none";
    el("qtext").textContent = q.question;
    el("total").textContent = exam.questions.length;
    el("jumpInput").value = idx + 1;
    el("jumpInput").max = exam.questions.length;

    const opts = el("options");
    opts.innerHTML = "";
    (q.answers || []).forEach((a) => {
      const div = document.createElement("div");
      div.className = "option" + (sel.has(a.letter) ? " selected" : "");
      div.innerHTML = `<span class="letter">${escape(a.letter)}</span><span>${escape(a.text)}</span>`;
      if (!reviewMode) div.onclick = () => toggle(a.letter, multi);
      opts.appendChild(div);
    });

    el("answerBox").classList.remove("show");
    el("prevBtn").disabled = idx === 0;
    el("nextBtn").disabled = idx === exam.questions.length - 1;
    el("clearBtn").disabled = reviewMode;
    el("submitBtn").disabled = reviewMode;
    el("options").style.pointerEvents = reviewMode ? "none" : "";
    renderProgress();
    if (reviewMode) showAnswer();
  }

  function renderProgress() {
    const answered = Object.values(state.answers).filter((a) => a && a.length).length;
    el("progress").innerHTML =
      `<div class="done" style="width:${answered / exam.questions.length * 100}%"></div>`;
  }

  function toggle(letter, multi) {
    if (reviewMode) return;
    let sel = selSet(idx);
    if (multi) {
      sel.has(letter) ? sel.delete(letter) : sel.add(letter);
    } else {
      sel = sel.has(letter) ? new Set() : new Set([letter]);
    }
    setSel(idx, sel);
    saveState();
    render();
  }

  function showAnswer() {
    const q = currentQuestion();
    const correct = new Set(q.correct_answers || []);
    const sel = selSet(idx);

    document.querySelectorAll("#options .option").forEach((node) => {
      const letter = node.querySelector(".letter").textContent;
      node.classList.remove("selected");
      if (correct.has(letter)) node.classList.add("correct");
      else if (sel.has(letter)) node.classList.add("wrong");
    });

    const chosen = [...sel].sort().join(", ") || "—";
    const answer = [...correct].sort().join(", ");
    const isRight = sel.size > 0 && sel.size === correct.size && [...sel].every((l) => correct.has(l));
    el("answerHead").innerHTML =
      `Correct answer: <span class="ok">${escape(answer)}</span> &nbsp;|&nbsp; Your answer: ${escape(chosen)} ` +
      (sel.size ? (isRight ? "✅" : "❌") : "");
    el("explanation").textContent = q.explanation || "(no explanation)";
    el("answerBox").classList.add("show");
  }

  function go(delta) {
    const n = idx + delta;
    if (n >= 0 && n < exam.questions.length) { idx = n; saveState(); render(); window.scrollTo(0, 0); }
  }

  /* ---------- Grading ---------- */
  function grade() {
    let correct = 0, answered = 0;
    exam.questions.forEach((q, i) => {
      const sel = selSet(i);
      if (sel.size) answered++;
      const c = new Set(q.correct_answers || []);
      if (sel.size === c.size && sel.size > 0 && [...sel].every((l) => c.has(l))) correct++;
    });
    return { correct, answered, total: exam.questions.length };
  }

  async function submit() {
    const g = grade();
    const pct = Math.round(g.correct / g.total * 100);
    const used = TOTAL - remaining;
    const answersCopy = JSON.parse(JSON.stringify(state.answers));
    state.submitted = true;
    saveState();

    const pass = pct >= 70;
    el("resultBody").innerHTML =
      `<div class="score-big ${pass ? "pass" : "fail"}">${pct}%</div>` +
      `<p>Đúng <b>${g.correct}</b> / ${g.total} câu &nbsp;·&nbsp; đã trả lời ${g.answered} câu</p>` +
      `<p style="color:var(--muted)">Thời gian đã dùng: ${fmt(used)} &nbsp;·&nbsp; ${pass ? "✅ Đạt (≥70%)" : "❌ Chưa đạt"}</p>` +
      `<p class="hint" id="saveStatus"></p>`;
    el("resultOverlay").classList.add("show");

    if (sbEnabled) {
      el("saveStatus").textContent = "Đang lưu lên Supabase…";
      try {
        await sbInsert({
          device_id: deviceId, exam_id: exam.id, exam_name: exam.name,
          percent: pct, correct: g.correct, total: g.total,
          answered: g.answered, time_used: used, answers: answersCopy,
        });
        el("saveStatus").textContent = "✅ Đã lưu kết quả lên Supabase.";
      } catch (e) {
        el("saveStatus").textContent = "⚠ Không lưu được lên Supabase, đã lưu tạm trên máy. (" + e.message + ")";
        pushHistory(exam.id, { date: new Date().toISOString(), percent: pct, correct: g.correct, total: g.total, answered: g.answered, timeUsed: used, answers: answersCopy });
      }
    } else {
      pushHistory(exam.id, { date: new Date().toISOString(), percent: pct, correct: g.correct, total: g.total, answered: g.answered, timeUsed: used, answers: answersCopy });
      el("saveStatus").textContent = "ℹ Chưa cấu hình Supabase — đang lưu trong trình duyệt (sửa config.js).";
    }
  }

  /* ---------- History ---------- */
  function enterReview(rec) {
    if (!rec || !rec.answers) {
      alert("Lần làm này không lưu chi tiết đáp án nên không thể xem lại.");
      return;
    }
    reviewMode = true;
    reviewData = rec;
    el("reviewBanner").style.display = "flex";
    el("reviewInfo").textContent =
      `Đang xem lại lần làm ngày ${new Date(rec.date).toLocaleString()} — ${rec.percent}% (${rec.correct}/${rec.total} đúng)`;
    el("historyOverlay").classList.remove("show");
    idx = 0;
    render();
    window.scrollTo(0, 0);
  }

  function exitReview() {
    reviewMode = false;
    reviewData = null;
    el("reviewBanner").style.display = "none";
    idx = Math.min(state.idx || 0, exam.questions.length - 1);
    render();
  }

  async function openHistory() {
    el("historyTitle").textContent = `Lịch sử làm bài — ${exam.name}`;
    el("historyBody").innerHTML = "<p style='color:var(--muted)'>Đang tải…</p>";
    el("historyOverlay").classList.add("show");

    let h;
    try {
      h = sbEnabled ? await sbList(exam.id) : getHistory(exam.id);
    } catch (e) {
      el("historyBody").innerHTML = "<p style='color:#f87171'>Không tải được từ Supabase: " + escape(e.message) + "</p>";
      return;
    }
    historyCache = h;

    if (!h.length) {
      el("historyBody").innerHTML = "<p style='color:var(--muted)'>Chưa có lần làm nào.</p>";
      return;
    }
    const rows = h.map((r, i) => {
      const d = new Date(r.date);
      const rev = r.answers ? " ↗" : "";
      return `<tr class="hrow" data-idx="${i}"><td>${h.length - i}</td><td>${d.toLocaleString()}</td>` +
        `<td><b>${r.percent}%</b>${rev}</td><td>${r.correct}/${r.total}</td>` +
        `<td>${r.answered}</td><td>${fmt(r.timeUsed)}</td></tr>`;
    }).join("");
    el("historyBody").innerHTML =
      `<p class="hint">Bấm vào một dòng để xem lại chi tiết đúng/sai.` +
      (sbEnabled ? " (đã đồng bộ Supabase)" : "") + `</p>` +
      `<table><thead><tr><th>#</th><th>Ngày</th><th>Điểm</th><th>Đúng</th><th>Đã trả lời</th><th>Thời gian</th></tr></thead><tbody>${rows}</tbody></table>`;
    el("historyBody").querySelectorAll(".hrow").forEach((tr) => {
      tr.style.cursor = "pointer";
      tr.onmouseenter = () => (tr.style.background = "#0b1220");
      tr.onmouseleave = () => (tr.style.background = "");
      tr.onclick = () => enterReview(historyCache[+tr.dataset.idx]);
    });
  }

  /* ---------- Timer ---------- */
  function fmt(s) {
    s = Math.max(0, s | 0);
    const h = String(Math.floor(s / 3600)).padStart(2, "0");
    const m = String(Math.floor((s % 3600) / 60)).padStart(2, "0");
    const sec = String(s % 60).padStart(2, "0");
    return `${h}:${m}:${sec}`;
  }
  function updateTimer() {
    const t = el("timer");
    t.textContent = fmt(remaining);
    t.classList.toggle("warn", remaining <= 600 && remaining > 300);
    t.classList.toggle("danger", remaining <= 300);
  }
  function start() {
    running = true;
    el("pauseBtn").textContent = "⏸ Pause";
    el("pauseOverlay").classList.remove("show");
    if (tick) clearInterval(tick);
    tick = setInterval(() => {
      if (remaining <= 0) {
        clearInterval(tick);
        remaining = 0;
        updateTimer();
        saveState();
        el("pauseTitle").textContent = "⏰ Hết giờ!";
        el("pauseMsg").textContent = "Thời gian làm bài đã kết thúc.";
        el("resumeBtn").style.display = "none";
        el("pauseOverlay").classList.add("show");
        return;
      }
      remaining--;
      updateTimer();
      if (remaining % 5 === 0) saveState();
    }, 1000);
  }
  function pause() {
    running = false;
    if (tick) clearInterval(tick);
    el("pauseBtn").textContent = "▶ Resume";
    el("pauseTitle").textContent = "⏸ Paused";
    el("pauseMsg").textContent = "Bấm Resume để tiếp tục.";
    el("resumeBtn").style.display = "";
    el("pauseOverlay").classList.add("show");
    saveState();
  }

  /* ---------- Events ---------- */
  el("examSelect").onchange = (e) => {
    saveState();
    history.replaceState(null, "", "?exam=" + encodeURIComponent(e.target.value));
    loadExam(e.target.value);
  };
  el("showBtn").onclick = showAnswer;
  el("clearBtn").onclick = () => { setSel(idx, new Set()); saveState(); render(); };
  el("prevBtn").onclick = () => go(-1);
  el("nextBtn").onclick = () => go(1);
  el("jumpInput").onchange = (e) => {
    const n = parseInt(e.target.value, 10) - 1;
    if (n >= 0 && n < exam.questions.length) { idx = n; saveState(); render(); window.scrollTo(0, 0); }
    else e.target.value = idx + 1;
  };
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
    if (e.key === "ArrowLeft") go(-1);
    if (e.key === "ArrowRight") go(1);
    if (e.key.toLowerCase() === "s") showAnswer();
  });

  el("pauseBtn").onclick = () => (running ? pause() : start());
  el("resumeBtn").onclick = start;
  el("resetTimerBtn").onclick = () => { remaining = TOTAL; updateTimer(); saveState(); start(); };

  el("submitBtn").onclick = submit;
  el("closeResultBtn").onclick = () => el("resultOverlay").classList.remove("show");
  el("reviewBtn").onclick = () => { el("resultOverlay").classList.remove("show"); showAnswer(); };
  el("historyBtn").onclick = openHistory;
  el("exitReviewBtn").onclick = exitReview;

  el("closeHistoryBtn").onclick = () => el("historyOverlay").classList.remove("show");
  el("clearHistoryBtn").onclick = async () => {
    if (!confirm("Xóa toàn bộ lịch sử của " + exam.name + "?")) return;
    if (sbEnabled) {
      try { await sbClear(exam.id); }
      catch (e) { alert("Không xóa được trên Supabase: " + e.message); return; }
    } else {
      localStorage.removeItem(historyKey(exam.id));
    }
    openHistory();
  };
  el("resetProgressBtn").onclick = () => {
    if (confirm("Xóa bài làm hiện tại của " + exam.name + " (đáp án đã chọn + đồng hồ)?")) {
      localStorage.removeItem(stateKey(exam.id));
      loadExam(exam.id);
    }
  };

  window.addEventListener("beforeunload", saveState);

  buildExamSelect();
  const wantedExam = new URLSearchParams(location.search).get("exam");
  loadExam(wantedExam && EXAMS.some((e) => e.id === wantedExam) ? wantedExam : EXAMS[0].id);

  // Thông báo trạng thái lưu kết quả
  if (!sbEnabled) {
    const bar = document.createElement("div");
    bar.style.cssText = "background:#3a2a12;border:1px solid #fbbf24;color:#fde68a;padding:10px 16px;font-size:14px;border-radius:10px;max-width:960px;margin:16px auto 0;";
    bar.innerHTML = "⚠ Chưa cấu hình <b>Supabase</b> nên kết quả chỉ lưu trong trình duyệt. " +
      "Mở <b>config.js</b> điền <code>SUPABASE_URL</code> và <code>SUPABASE_ANON_KEY</code> để lưu lên cloud.";
    document.querySelector(".wrap").before(bar);
  }
})();
</script>
</body>
</html>
